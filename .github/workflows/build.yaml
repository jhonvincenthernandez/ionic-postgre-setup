name: Build Name Age CRUD Android APK
 
on:
  push:
    branches: [main]
  workflow_dispatch:
 
permissions:
  contents: read
 
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
 
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
 
      - name: Install dependencies
        run: npm ci
 
      - name: Create Firebase web config
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
        run: |
          if [ -z "$FIREBASE_ENV" ]; then
            echo "Missing FIREBASE_ENV repository secret. Add the six VITE_FIREBASE_* web config values."
            exit 1
          fi
          printf '%s' "$FIREBASE_ENV" > .env
 
      - name: Build Vue app
        run: npm run build
 
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
 
      - name: Verify Android project exists
        run: test -f android/gradlew
 
      - name: Sync Capacitor Android
        run: npx cap sync android
 
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
 
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: NameAgeCRUD-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30